server {
    listen 80;
    server_name _;

    # Root path
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Redirect /musicbox to /musicbox/
    location = /musicbox {
        return 301 /musicbox/;
    }

    # App under /musicbox/
    location /musicbox/ {
        rewrite ^/musicbox/?(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Optional rate limit for downloads (root)
    location /api/downloads {
        limit_req zone=downloads burst=5 nodelay;
        proxy_pass http://127.0.0.1:8000;
    }

    # Optional rate limit for downloads (subpath)
    location /musicbox/api/downloads {
        rewrite ^/musicbox/?(.*)$ /$1 break;
        limit_req zone=downloads burst=5 nodelay;
        proxy_pass http://127.0.0.1:8000/;
    }
}

